services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: securetask-web

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: sqlite:////data/securetask.db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}

    read_only: true

    tmpfs:
      - /tmp

    volumes:
      - securetask-data:/data

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

volumes:
  securetask-data: