rules:
  - id: securetask-hardcoded-secret
    languages:
      - python
    message: "Hard-coded secret detected. Store credentials in environment variables or a secret manager."
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: $X = "..."
          - pattern: $X = '...'
      - metavariable-regex:
          metavariable: $X
          regex: (?i)(password|passwd|secret|api[_-]?key|token|access[_-]?key)
    metadata:
      category: security
      technology:
        - python
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
