<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureTask</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">SecureTask</div>

        <button id="logoutButton" class="logout-button hidden">
            Logout
        </button>
    </header>

    <main class="container">

        <!-- Authentication -->
        <section id="authSection" class="auth-section">

            <div class="auth-card">

                <h1>SecureTask</h1>
                <p class="subtitle">
                    Simple and secure task management
                </p>

                <div class="tabs">
                    <button id="loginTab" class="tab active">
                        Login
                    </button>

                    <button id="registerTab" class="tab">
                        Register
                    </button>
                </div>

                <!-- Login -->
                <form id="loginForm">

                    <label for="loginUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="loginUsername"
                        required
                        minlength="3"
                    >

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        required
                        minlength="8"
                    >

                    <button type="submit" class="primary-button">
                        Login
                    </button>

                </form>

                <!-- Register -->
                <form id="registerForm" class="hidden">

                    <label for="registerUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="registerUsername"
                        required
                        minlength="3"
                        maxlength="50"
                    >

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        required
                    >

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        required
                        minlength="8"
                    >

                    <button type="submit" class="primary-button">
                        Create Account
                    </button>

                </form>

                <p id="authMessage" class="message"></p>

            </div>

        </section>

        <!-- Dashboard -->
        <section id="dashboardSection" class="hidden">

            <div class="dashboard-header">
                <div>
                    <h1>My Tasks</h1>
                    <p>Manage your tasks securely.</p>
                </div>
            </div>

            <!-- Create task -->
            <div class="task-form-card">

                <h2>Create New Task</h2>

                <form id="taskForm">

                    <label for="taskTitle">
                        Task Title
                    </label>

                    <input
                        type="text"
                        id="taskTitle"
                        maxlength="200"
                        required
                    >

                    <label for="taskDescription">
                        Description
                    </label>

                    <textarea
                        id="taskDescription"
                        maxlength="1000"
                        rows="4"
                    ></textarea>

                    <button type="submit" class="primary-button">
                        Add Task
                    </button>

                </form>

                <p id="taskMessage" class="message"></p>

            </div>

            <!-- Task list -->
            <div class="tasks-card">

                <div class="tasks-heading">
                    <h2>Your Tasks</h2>

                    <button
                        id="refreshButton"
                        class="secondary-button"
                    >
                        Refresh
                    </button>
                </div>

                <div id="taskList">
                    <p class="empty-message">
                        No tasks yet.
                    </p>
                </div>

            </div>

        </section>

    </main>

    <script src="/static/app.js"></script>

</body>
</html>
