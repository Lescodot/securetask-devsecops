name: Checkov IaC Security Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov Infrastructure Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Scan Dockerfile with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          file: Dockerfile
          framework: dockerfile
          quiet: false
          soft_fail: false

      - name: Scan Docker Compose with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          file: docker-compose.yml
          framework: yaml
          quiet: false
          soft_fail: false